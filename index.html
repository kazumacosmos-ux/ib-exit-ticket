<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-B出口 時間帯予約</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <h1>1-B出口</h1>
    <h2>時間帯予約</h2>

    <section id="reserveArea">

      <p>行きたい時間帯を選んで予約してください。</p>

      <label for="size">人数</label>
      <select id="size">
        <option value="1">1人</option>
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
      </select>

      <label for="slot">時間帯</label>
      <select id="slot"></select>

      <p id="slotInfo" class="slot-info"></p>

      <button id="reserve">
        この時間帯で予約する
      </button>

      <p id="error" class="error"></p>

    </section>

    <section id="reservationArea" hidden>

      <p>予約が完了しました</p>

      <div class="reservation-number">
        <span>予約番号</span>
        <strong id="myNumber">-</strong>
      </div>

      <p>
        予約時間
      </p>

      <div id="mySlot" class="big">
        -
      </div>

      <p>
        人数：<strong id="mySize">-</strong>人
      </p>

      <p class="notice">
        この画面をスタッフに見せられるようにしておいてください。
      </p>

    </section>

    <section id="closedArea" hidden>
      <p class="notice">
        現在、予約受付を停止しています。
      </p>
    </section>

    <p id="error2" class="error"></p>

  </main>

  <script type="module" src="app.js"></script>

</body>

</html>
