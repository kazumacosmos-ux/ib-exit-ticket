<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>1-B出口 整理券</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <h1>1-B出口</h1>
    <h2>整理券</h2>

    <section id="issueArea">

      <p>1グループにつき1枚です。</p>

      <label for="size">人数</label>

      <select id="size">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <button id="issue">
        整理券を取る
      </button>

      <p id="error" class="error"></p>

    </section>


    <section id="ticketArea" hidden>

      <p>あなたの整理券番号</p>

      <div id="myNumber" class="big">-</div>

      <p>
        現在の案内番号：
        <strong id="current">-</strong>
      </p>

      <p id="distance"></p>

      <div id="status" class="status"></div>

    </section>


    <p id="closed" class="notice" hidden>
      現在、整理券の発行を停止しています。
    </p>

  </main>


  <script type="module" src="app.js"></script>

</body>

</html>
