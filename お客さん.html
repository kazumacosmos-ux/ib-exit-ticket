<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>1-B出口搭乗券</title>

  <link
    rel="stylesheet"
    href="./デザイン.css"
  >

</head>


<body>

  <main class="container">


    <!-- ==========================
         タイトル
         ========================== -->

    <h1>
      1-B出口 予約
    </h1>


    <!-- ==========================
         予約フォーム
         ========================== -->

    <section id="reserveArea">

      <h2>
        ご予約
      </h2>


      <label for="name">
        代表者の名前
      </label>

      <input
        id="name"
        type="text"
        maxlength="30"
        placeholder="代表者の名前"
      >


      <label for="size">
        人数
      </label>

      <select id="size">

        <option value="1">
          1人
        </option>

        <option value="2">
          2人
        </option>

        <option value="3">
          3人
        </option>

        <option value="4">
          4人
        </option>

      </select>


      <label for="slot">
        ご来場時間
      </label>

      <select id="slot">
      </select>


      <p
        id="slotInfo"
        class="slot-info"
      ></p>


      <button
        id="reserve"
        type="button"
      >
        この時間帯で予約する
      </button>


      <p
        id="error"
        class="error"
      ></p>

    </section>


    <!-- ==========================
         予約済み搭乗券
         
         中身は
         お客さん.js
         が自動で作ります
         ========================== -->

    <section
      id="reservationArea"
      hidden
    >
    </section>


    <!-- ==========================
         受付停止
         ========================== -->

    <section
      id="closedArea"
      hidden
    >

      <h2>
        現在受付停止中です
      </h2>

      <p>
        スタッフから案内があるまでお待ちください。
      </p>

    </section>


  </main>


  <!-- ==========================
       JavaScript
       
       ?v= の数字を変えて
       古いキャッシュを防止
       ========================== -->

  <script
    type="module"
    src="./お客さん.js?v=20260908-5"
  ></script>


</body>

</html>
