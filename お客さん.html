<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>1-B出口搭乗券</title>


  <link
    rel="stylesheet"
    href="./デザイン.css?v=20260909-5"
  >


  <style>

    /* =========================================
       基本
    ========================================= */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #dff4ff 0%,
          #f5fbff 45%,
          #ffffff 100%
        );

      color: #12304a;
    }


    .container {

      width: min(
        94%,
        720px
      );

      margin:
        0 auto;

      padding:
        24px 0 40px;
    }


    h1 {

      margin:
        0 0 20px;

      text-align: center;

      color: #0b4f82;

      font-size: 28px;

      letter-spacing:
        0.04em;
    }


    h2 {

      color: #0b4f82;
    }


    /* =========================================
       予約フォーム
    ========================================= */

    #reserveArea {

      background:
        rgba(
          255,
          255,
          255,
          0.94
        );

      border-radius:
        18px;

      padding:
        24px;

      box-shadow:
        0 8px 30px
        rgba(
          35,
          105,
          150,
          0.12
        );
    }


    #reserveArea h2 {

      margin-top: 0;
    }


    label {

      display: block;

      margin:
        18px 0 7px;

      font-weight: bold;

      color: #174b70;
    }


    input,
    select {

      width: 100%;

      min-height: 48px;

      padding:
        10px 14px;

      border:
        1px solid #b7d7ea;

      border-radius:
        10px;

      background: #ffffff;

      color: #12304a;

      font-size: 16px;
    }


    input:focus,
    select:focus {

      outline: none;

      border-color:
        #2988c7;

      box-shadow:
        0 0 0 3px
        rgba(
          41,
          136,
          199,
          0.15
        );
    }


    .slot-info {

      margin:
        10px 0;

      color: #28709c;

      font-weight: bold;
    }


    #reserve {

      width: 100%;

      min-height: 52px;

      margin-top: 20px;

      border: none;

      border-radius:
        12px;

      background:
        linear-gradient(
          135deg,
          #1688ca,
          #075b96
        );

      color: #ffffff;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 5px 15px
        rgba(
          20,
          112,
          165,
          0.22
        );
    }


    #reserve:disabled {

      opacity: 0.5;

      cursor: not-allowed;
    }


    .error {

      min-height: 24px;

      margin:
        12px 0 0;

      color: #d33d3d;

      font-weight: bold;
    }


    /* =========================================
       受付停止
    ========================================= */

    #closedArea {

      margin-top: 20px;

      padding: 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.95
        );

      border-radius:
        18px;

      text-align: center;

      box-shadow:
        0 8px 30px
        rgba(
          35,
          105,
          150,
          0.12
        );
    }


    /* =========================================
       搭乗券
    ========================================= */

    .boarding-pass {

      position: relative;

      overflow: hidden;

      margin-top: 10px;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f5fbff 100%
        );

      border:
        1px solid #c5e1f1;

      border-radius:
        20px;

      box-shadow:
        0 12px 35px
        rgba(
          25,
          105,
          150,
          0.16
        );
    }


    .boarding-pass::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 7px;

      background:
        linear-gradient(
          90deg,
          #0a78b7,
          #61c7ef,
          #0a78b7
        );
    }


    .boarding-pass-header {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 16px;

      padding:
        28px 24px 20px;

      border-bottom:
        1px dashed #9fc9df;
    }


    .boarding-pass-header h2 {

      margin:
        0 0 5px;

      font-size: 22px;
    }


    .boarding-pass-header p {

      margin: 0;

      color: #5d8097;

      font-size: 13px;
    }


    .boarding-pass-header > strong {

      color: #0b5c91;

      font-size: 18px;

      white-space: nowrap;

      letter-spacing:
        0.04em;
    }


    .boarding-pass-main {

      padding:
        22px 24px;
    }


    .boarding-arrival {

      padding:
        16px;

      margin-bottom:
        18px;

      border-radius:
        12px;

      background:
        linear-gradient(
          135deg,
          #e5f6ff,
          #f5fcff
        );

      text-align: center;
    }


    .boarding-arrival span {

      display: block;

      margin-bottom:
        5px;

      color: #5a7f95;

      font-size: 13px;
    }


    .boarding-arrival strong {

      color: #075d93;

      font-size: 27px;

      letter-spacing:
        0.04em;
    }


    .boarding-info-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap: 14px;

      margin-bottom:
        18px;
    }


    .boarding-info-grid > div {

      padding:
        13px;

      border:
        1px solid #d4e8f3;

      border-radius:
        10px;

      background: #ffffff;
    }


    .boarding-info-grid span,
    .boarding-pass-passenger span {

      display: block;

      margin-bottom:
        5px;

      color: #67879a;

      font-size: 12px;
    }


    .boarding-info-grid strong {

      color: #194e6d;

      font-size: 16px;
    }


    .boarding-pass-passenger {

      padding:
        15px;

      border-top:
        1px solid #d4e8f3;

      border-bottom:
        1px solid #d4e8f3;
    }


    .boarding-pass-passenger strong {

      color: #0b4f82;

      font-size: 20px;
    }


    .boarding-pass-footer {

      padding:
        18px 24px 24px;
    }


    .boarding-note {

      margin:
        0 0 18px;

      color: #55798e;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =========================================
       キャンセルボタン
    ========================================= */

    .cancel-reservation {

      width: 100%;

      min-height: 48px;

      border:
        1px solid #c5dce9;

      border-radius:
        10px;

      background:
        #ffffff;

      color: #557286;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }


    .cancel-reservation:hover {

      background:
        #f3f9fc;
    }


    /* =========================================
       スマートフォン
    ========================================= */

    @media (
      max-width: 480px
    ) {

      .container {

        width: 94%;

        padding-top:
          18px;
      }


      h1 {

        font-size: 24px;
      }


      #reserveArea {

        padding: 18px;
      }


      .boarding-pass-header {

        padding:
          24px 18px 18px;

        align-items:
          flex-start;
      }


      .boarding-pass-header h2 {

        font-size: 19px;
      }


      .boarding-pass-header > strong {

        font-size: 14px;
      }


      .boarding-pass-main {

        padding:
          18px;
      }


      .boarding-arrival strong {

        font-size: 23px;
      }


      .boarding-info-grid {

        gap: 9px;
      }


      .boarding-info-grid > div {

        padding:
          11px;
      }


      .boarding-pass-footer {

        padding:
          16px 18px 20px;
      }

    }

  </style>

</head>


<body>


  <main class="container">


    <h1>
      1-B出口 予約
    </h1>


    <!-- =====================================
         予約入力
    ====================================== -->

    <section id="reserveArea">

      <h2>
        ご予約
      </h2>


      <label for="name">
        代表者の名前
      </label>


      <input
        id="name"
        type="text"
        maxlength="30"
        placeholder="代表者の名前"
      >


      <label for="size">
        人数
      </label>


      <select id="size">

        <option value="1">
          1人
        </option>

        <option value="2">
          2人
        </option>

        <option value="3">
          3人
        </option>

        <option value="4">
          4人
        </option>

      </select>


      <label for="slot">
        ご来場時間
      </label>


      <select id="slot"></select>


      <p
        id="slotInfo"
        class="slot-info"
      ></p>


      <button
        id="reserve"
        type="button"
      >
        この時間帯で予約する
      </button>


      <p
        id="error"
        class="error"
      ></p>


    </section>


    <!-- =====================================
         予約完了
    ====================================== -->

    <section
      id="reservationArea"
      hidden
    ></section>


    <!-- =====================================
         受付停止
    ====================================== -->

    <section
      id="closedArea"
      hidden
    >

      <h2>
        現在受付停止中です
      </h2>


      <p>
        スタッフから案内があるまでお待ちください。
      </p>

    </section>


  </main>


  <!-- =======================================
       JavaScript
       ※ バージョン番号を更新
  ======================================== -->

  <script
    type="module"
    src="./お客さん.js?v=20260909-5"
  ></script>


</body>

</html>
