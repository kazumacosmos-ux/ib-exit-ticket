<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタッフ管理</title>
  <link rel="stylesheet" href="./デザイン.css">
</head>

<body>

  <main class="container">

    <h1>スタッフ管理</h1>

    <section id="loginArea">

      <h2>スタッフログイン</h2>

      <label for="password">
        パスワード
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="パスワードを入力"
      >

      <button id="login">
        ログイン
      </button>

      <p id="loginMessage" class="error"></p>

    </section>


    <section id="adminArea" style="display:none;">

      <h2>受付設定</h2>

      <p id="receptionState">
        受付中
      </p>

      <button id="toggleOpen">
        受付停止
      </button>


      <h3>時間設定</h3>

      <p>
        開始時刻：<strong>09:00</strong>
      </p>

      <p>
        終了時刻：<strong>15:00</strong>
      </p>


      <label>
        1枠の時間

        <input
          id="slotMinutes"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="例：30"
        >

        分
      </label>


      <label>
        1枠あたりの最大組数

        <select id="maxGroups">

          <option value="1">1組</option>
          <option value="2">2組</option>
          <option value="3">3組</option>
          <option value="4">4組</option>
          <option value="5">5組</option>
          <option value="6">6組</option>
          <option value="7">7組</option>
          <option value="8">8組</option>
          <option value="9">9組</option>
          <option value="10">10組</option>

        </select>

      </label>


      <button id="saveSettings">
        設定を保存
      </button>

      <p id="settingsMessage"></p>


      <hr>


      <h2>紙予約を追加</h2>

      <label>
        名前

        <input
          id="paperName"
          type="text"
          placeholder="代表者名など"
        >
      </label>


      <label>
        人数

        <select id="paperSize">

          <option value="1">1人</option>
          <option value="2">2人</option>
          <option value="3">3人</option>
          <option value="4">4人</option>

        </select>

      </label>


      <label>
        時間枠

        <select id="paperSlot"></select>

      </label>


      <p id="paperSlotInfo"></p>


      <button id="addPaper">
        紙予約を追加
      </button>

      <p id="paperMessage"></p>


      <hr>


      <h2>予約一覧</h2>

      <div id="slotList"></div>


      <hr>


      <button id="logout">
        ログアウト
      </button>

    </section>

  </main>


  <script
    type="module"
    src="./スタッフ.js?v=20260908"
  ></script>

</body>
</html>
