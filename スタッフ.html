<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スタッフ管理</title>

  <link
    rel="stylesheet"
    href="./デザイン.css"
  >
</head>

<body>

  <main class="container">

    <h1>スタッフ管理</h1>

    <!-- =========================
         スタッフログイン
    ========================== -->

    <section id="loginArea">

      <h2>スタッフログイン</h2>

      <label for="password">
        パスワード
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="パスワードを入力"
      >

      <button id="login">
        ログイン
      </button>

      <p
        id="loginMessage"
        class="error"
      ></p>

    </section>


    <!-- =========================
         スタッフ管理画面
    ========================== -->

    <section
      id="adminArea"
      style="display:none;"
    >

      <!-- =========================
           受付状況
      ========================== -->

      <h2>受付状況</h2>

      <p>
        現在の受付状況を確認できます。
      </p>

      <p id="receptionState">
        受付中
      </p>


      <hr>


      <!-- =========================
           紙予約
      ========================== -->

      <h2>紙予約を追加</h2>

      <label>
        名前
        <input
          id="paperName"
          type="text"
          placeholder="代表者名など"
        >
      </label>

      <label>
        人数

        <select id="paperSize">

          <option value="1">
            1人
          </option>

          <option value="2">
            2人
          </option>

          <option value="3">
            3人
          </option>

          <option value="4">
            4人
          </option>

        </select>

      </label>

      <label>
        時間枠

        <select id="paperSlot">
        </select>

      </label>

      <p id="paperSlotInfo"></p>

      <button id="addPaper">
        紙予約を追加
      </button>

      <p id="paperMessage"></p>


      <hr>


      <!-- =========================
           予約一覧
      ========================== -->

      <h2>予約一覧</h2>

      <div id="slotList">
      </div>


      <hr>


      <!-- =========================
           ログアウト
      ========================== -->

      <button
        id="logout"
        type="button"
      >
        ログアウト
      </button>


      <hr>


      <!-- =========================
           管理者設定
           ★ 一番下
      ========================== -->

      <section>

        <h2>🔐 管理者設定</h2>

        <p>
          受付時間・1枠の時間・最大組数などの
          管理者向け設定を変更します。
        </p>

        <button
          id="openAdminSettings"
          type="button"
        >
          管理者設定を開く
        </button>

      </section>

    </section>

  </main>


  <script
    type="module"
    src="./スタッフ.js?v=20260909-admin2"
  ></script>

</body>
</html>
